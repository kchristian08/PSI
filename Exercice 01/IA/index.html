<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Inicial | App de Cadastro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #4a5568;
            margin-bottom: 20px;
            font-size: 2.2rem;
        }

        p {
            color: #2d3748;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .btn {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 12px 28px;
            text-decoration: none;
            border-radius: 40px;
            font-weight: bold;
            transition: transform 0.2s, background 0.2s;
        }

        .btn:hover {
            background: #5a67d8;
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌟 Bem-vindo!</h1>
        <p>
            Este é um projeto de demonstração onde você pode se cadastrar informando seu nome.
            Após o envio, uma mensagem personalizada será exibida na página de resposta.
            Navegue entre as páginas de forma simples e intuitiva.
        </p>
        <a href="cadastro.html" class="btn">📝 Ir para Cadastro</a>
    </div>
</body>
</html>
