<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Time - Futebol</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚽ Cadastro de Equipe - Futebol</h1>
            <p>Preencha os dados abaixo para inscrever sua equipe</p>
        </header>

        <div class="form-card">
            <form id="formCadastroFutebol">
                <div class="form-group">
                    <label for="turma">Nome da turma:</label>
                    <input type="text" id="turma" name="turma" placeholder="Ex: 3° Ano A" required>
                </div>

                <div class="form-group">
                    <label for="equipe">Nome da equipe:</label>
                    <input type="text" id="equipe" name="equipe" placeholder="Ex: Os Boleiros" required>
                </div>

                <div class="form-group">
                    <label for="capitao">Capitão / Capitã:</label>
                    <input type="text" id="capitao" name="capitao" placeholder="Nome completo" required>
                </div>

                <button type="submit" class="btn-primary">Cadastrar Equipe</button>
                <a href="index.html" class="btn-secondary">Voltar ao início</a>
            </form>
        </div>

        <footer>
            <p>Participante da equipe: christian Kallil (BTWO)</p>
        </footer>
    </div>

    <script>
        document.getElementById('formCadastroFutebol').addEventListener('submit', function(e) {
            e.preventDefault();

            const turma = document.getElementById('turma').value.trim();
            const equipe = document.getElementById('equipe').value.trim();
            const capitao = document.getElementById('capitao').value.trim();

            if (turma === '' || equipe === '' || capitao === '') {
                alert('Por favor, preencha todos os campos.');
                return;
            }

            const dadosEquipe = {
                turma: turma,
                equipe: equipe,
                capitao: capitao
            };

            localStorage.setItem('equipeFutebol', JSON.stringify(dadosEquipe));
            window.location.href = 'futebol_exibir.html';
        });
    </script>
</body>
</html>
